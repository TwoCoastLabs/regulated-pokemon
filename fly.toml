# fly.io deployment for the hosted demo (issue #36; hosted for the public
# under epic #212).
#
#   fly launch --no-deploy          # once; keeps this file
#   fly secrets set OPENROUTER_API_KEY=sk-or-…
#   fly deploy
#
# The key is the ceiling. The relay's caps (src/relay/relay.ts,
# RELAY_DEFAULTS) live in memory and start over on every restart, and this
# machine stops when idle and starts on the next request, so a "daily" cap
# is really a per-wake cap. The hard bound on what a month can cost is
# therefore the key itself: the secret above must be a key created for
# this relay alone, never the one the harness runs on, with a credit limit
# set on it at the provider (OpenRouter: per-key credit limit with a
# monthly reset). A call over that limit is refused by the provider before
# it is priced. The relay's caps keep one wake cheap; the key keeps the
# month bounded.
#
# The defaults, and the measurement each is set from (the page's own dev
# trace, 2026-09-04 to 2026-09-23, 353 model calls):
#
#   RELAY_MAX_CONTENT_CHARS   60000   largest prompt sent 14,457 chars
#   RELAY_CALL_RESERVE_USD    0.01    dearest priced call $0.0038 (352 priced)
#   RELAY_DAILY_SPEND_CAP_USD 1       median call $0.0007, so ~1,000 calls
#   RELAY_DAILY_CALL_CAP      2000    the backstop for unpriced calls
#   RELAY_PER_IP_LIMIT        30      per RELAY_PER_IP_WINDOW_MS (5 minutes)
#   RELAY_MAX_TOKENS          2048
#
# Override any of them here under [env] or with `fly secrets set`;
# RELAY_MODELS narrows the allowlist. The relay logs one line per refusal
# (reason, ip, origin) and one at each UTC day rollover with the day's
# tallies; `fly logs` is where abuse is read, and whether the chat door
# needs an origin check is decided from those lines, not assumed.

app = "indigo-accord"
primary_region = "sea"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
